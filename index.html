<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Slides Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100%; height: 100vh; background: #1f2937; } /* Darker background for contrast */
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-sans">

    <!-- 1. LOBBY UI -->
    <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-50">
        <h1 class="text-3xl font-bold mb-6 text-blue-400">Live Slides</h1>
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-80 text-center">
            <h2 class="text-gray-300 mb-4 text-sm font-semibold uppercase tracking-wider">Join a Session</h2>
            <input type="text" id="room-code" maxlength="4" placeholder="ROOM CODE" class="w-full text-center text-2xl font-bold p-3 mb-3 bg-gray-700 border-2 border-gray-600 rounded-lg text-white uppercase focus:border-blue-500 focus:outline-none">
            <input type="text" id="player-initials" maxlength="2" placeholder="INITIALS (e.g. TH)" class="w-full text-center text-2xl font-bold p-3 mb-4 bg-gray-700 border-2 border-gray-600 rounded-lg text-white uppercase focus:border-blue-500 focus:outline-none">
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors">Connect</button>
            <button id="host-btn" class="w-full mt-4 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-bold py-2 rounded-lg transition-colors">Start as Host</button>
        </div>
    </div>

    <!-- 2. HOST DASHBOARD (Level Select) -->
    <div id="host-dashboard" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-40">
        <h2 class="text-3xl font-bold text-white mb-8">Select Presentation</h2>
        <div class="grid gap-4 w-96">
            <button class="level-select-btn bg-purple-600 hover:bg-purple-500 p-4 rounded-lg text-xl font-bold text-left shadow-lg" data-level="pitch">
                🎤 Pitch Like a Pro
            </button>
            <button class="level-select-btn bg-emerald-600 hover:bg-emerald-500 p-4 rounded-lg text-xl font-bold text-left shadow-lg" data-level="network">
                🤝 Networking Skills
            </button>
            <button class="level-select-btn bg-blue-600 hover:bg-blue-500 p-4 rounded-lg text-xl font-bold text-left shadow-lg" data-level="scriptless">
                🧠 Speak Without a Script
            </button>
        </div>
        <div class="mt-8 text-gray-400">Room Code: <span id="dash-room-code" class="text-white font-bold text-xl"></span></div>
    </div>

    <!-- 3. HOST UI (The Slides/Canvas) -->
    <div id="host-ui" class="hidden absolute inset-0 z-10">
        <div class="absolute top-4 left-4 bg-black/50 px-4 py-2 rounded-lg backdrop-blur-sm z-20 flex flex-col">
            <span class="text-gray-300 text-sm">Room Code: <span id="display-room-code" class="text-2xl font-bold text-white ml-2">----</span></span>
            <span id="slide-counter" class="text-gray-400 text-xs mt-1">Slide 1/X</span>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- 4. PLAYER UI (Unchanged) -->
    <div id="player-ui" class="hidden absolute inset-0 flex flex-col items-center justify-end pb-12 bg-gray-900 z-10">
        <div class="mb-auto mt-8 text-center flex flex-col items-center">
            <div class="text-gray-400 text-sm mb-3">Your Domino</div>
            <div id="player-domino" class="w-16 h-24 rounded shadow-[0_0_15px_rgba(255,255,255,0.2)] flex flex-col overflow-hidden border-2 border-white text-white font-bold text-xl">
                <div id="domino-initials" class="flex-1 flex items-center justify-center border-b-2 border-white/30 bg-black/20"></div>
                <div id="domino-number" class="flex-1 flex items-center justify-center bg-black/40"></div>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-2 w-48 h-48 mb-8">
            <div></div><button id="btn-up" class="bg-gray-700 rounded-lg active:bg-blue-500"></button><div></div>
            <button id="btn-left" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div class="bg-gray-800 rounded-full shadow-inner"></div>
            <button id="btn-right" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div></div><button id="btn-down" class="bg-gray-700 rounded-lg active:bg-blue-500"></button><div></div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
