<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Slides Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevents mobile pull-to-refresh and selection during gameplay */
        body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100%; height: 100vh; background: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-sans">

    <!-- LOBBY UI: Enter 4-Digit Code -->
    <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-50">
        <h1 class="text-3xl font-bold mb-6 text-blue-400">Live Slides</h1>
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-80 text-center">
            <h2 class="text-gray-300 mb-4 text-sm font-semibold uppercase tracking-wider">Join a Session</h2>
            <input type="text" id="room-code" maxlength="4" placeholder="4-DIGIT CODE" 
                   class="w-full text-center text-3xl font-bold p-3 mb-4 bg-gray-700 border-2 border-gray-600 rounded-lg text-white uppercase focus:border-blue-500 focus:outline-none">
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors">
                Connect
            </button>
            <button id="host-btn" class="w-full mt-4 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-bold py-2 rounded-lg transition-colors">
                Start as Host (Create Room)
            </button>
        </div>
    </div>

    <!-- HOST UI: The Presentation Canvas -->
    <div id="host-ui" class="hidden absolute inset-0 z-10">
        <div class="absolute top-4 left-4 bg-black/50 px-4 py-2 rounded-lg backdrop-blur-sm z-20">
            <span class="text-gray-300 text-sm">Room Code:</span>
            <span id="display-room-code" class="text-2xl font-bold text-white ml-2">----</span>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- PLAYER UI: The Mobile Controller -->
    <div id="player-ui" class="hidden absolute inset-0 flex flex-col items-center justify-end pb-12 bg-gray-900 z-10">
        <div class="mb-auto mt-8 text-center">
            <div class="text-gray-400 text-sm mb-1">Connected as</div>
            <div id="player-color-indicator" class="w-12 h-12 rounded-full mx-auto shadow-[0_0_15px_rgba(255,255,255,0.2)]"></div>
        </div>
        
        <!-- Simple D-Pad -->
        <div class="grid grid-cols-3 gap-2 w-48 h-48 mb-8">
            <div></div>
            <button id="btn-up" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div></div>
            <button id="btn-left" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div class="bg-gray-800 rounded-full flex items-center justify-center shadow-inner"></div>
            <button id="btn-right" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div></div>
            <button id="btn-down" class="bg-gray-700 rounded-lg active:bg-blue-500"></button>
            <div></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="./app.js"></script>
</body>
</html>
