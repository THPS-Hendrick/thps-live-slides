<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation; /* Prevents double-tap zooming */
        }
        .dpad-btn {
            background: #e5e7eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #374151;
            user-select: none;
            touch-action: none; /* Crucial for preventing scroll while holding */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background 0.1s, transform 0.1s;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: #d1d5db;
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        canvas {
            image-rendering: optimizeSpeed;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Loading Screen -->
    <div id="loading-screen" class="flex flex-col items-center justify-center w-full h-full absolute inset-0 bg-gray-50 z-50">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 class="text-xl font-semibold text-gray-700">Connecting to Presentation...</h2>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="hidden flex-col items-center max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Interactive Slides</h1>
        <p class="text-gray-500 mb-8 text-center">Choose your role to get started.</p>
        
        <button id="btn-host-start" class="w-full mb-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2-2v8a2 2 0 002 2z" />
            </svg>
            Host Presentation
        </button>
        <button id="btn-player-start" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            Join as Player
        </button>
    </div>

    <!-- Host Screen -->
    <div id="host-screen" class="hidden flex-col items-center w-full max-w-5xl">
        <div class="flex w-full justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-100 rounded-lg flex flex-col items-center justify-center border-2 border-blue-400">
                    <span class="text-xs font-bold text-blue-600 uppercase">Opt A</span>
                    <span id="score-a" class="text-2xl font-black text-blue-700">0</span>
                </div>
            </div>
            
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-800">Live Decision Matrix</h2>
                <p class="text-sm text-gray-500">Players: Move your avatar into a zone to vote.</p>
            </div>

            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-red-100 rounded-lg flex flex-col items-center justify-center border-2 border-red-400">
                    <span class="text-xs font-bold text-red-600 uppercase">Opt B</span>
                    <span id="score-b" class="text-2xl font-black text-red-700">0</span>
                </div>
            </div>
        </div>

        <div class="relative w-full aspect-[4/3] max-w-[800px] bg-white rounded-2xl shadow-xl overflow-hidden border-4 border-gray-800">
            <canvas id="presentation-canvas" width="800" height="600" class="w-full h-full block bg-gray-50"></canvas>
        </div>
    </div>

    <!-- Player Screen -->
    <div id="player-screen" class="hidden flex-col items-center w-full max-w-sm">
        <div class="bg-white w-full rounded-2xl shadow-md border border-gray-100 p-6 mb-8 text-center">
            <div class="flex justify-center mb-4">
                <div id="player-avatar" class="w-16 h-16 rounded-full border-4 border-white shadow-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>
            <h2 class="text-xl font-bold text-gray-800">You are connected!</h2>
            <p class="text-sm text-gray-500 mt-2">Look at the main screen and use the controller below to move your avatar.</p>
        </div>

        <!-- D-Pad -->
        <div class="grid grid-cols-3 gap-3 w-64 h-64 select-none">
            <div></div>
            <button id="btn-up" class="dpad-btn" aria-label="Up">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" /></svg>
            </button>
            <div></div>
            <button id="btn-left" class="dpad-btn" aria-label="Left">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button id="btn-down" class="dpad-btn" aria-label="Down">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <button id="btn-right" class="dpad-btn" aria-label="Right">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </div>

    <!-- Firebase Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-presentation-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Default placeholder config to prevent immediate crashes outside immersive, 
            // though it requires actual config to sync.
            apiKey: "demo-key", projectId: "demo-project"
        };
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Init Firebase
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.error("Firebase init failed", e);
        }

        // State variables
        let currentUser = null;
        let activePlayers = {}; // Stores all connected players
        const PLAYER_COLLECTION = 'players'; // Note: Will be wrapped in strict path logic below
        
        // Colors for assigning to players
        const avatarColors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e', 
            '#10b981', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', 
            '#8b5cf6', '#d946ef', '#f43f5e'
        ];

        // Canvas Setup (800x600 logical resolution)
        const canvas = document.getElementById('presentation-canvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_W = 800;
        const CANVAS_H = 600;
        const PLAYER_RADIUS = 15;

        // Zones Definition
        const zones = {
            A: { x: 50, y: 100, w: 300, h: 400, color: 'rgba(59, 130, 246, 0.1)', borderColor: '#3b82f6', label: 'Option A' },
            B: { x: 450, y: 100, w: 300, h: 400, color: 'rgba(239, 68, 68, 0.1)', borderColor: '#ef4444', label: 'Option B' }
        };

        // DOM Elements
        const screens = {
            loading: document.getElementById('loading-screen'),
            start: document.getElementById('start-screen'),
            host: document.getElementById('host-screen'),
            player: document.getElementById('player-screen')
        };
        
        // --- Core Application Logic ---

        async function initAuth() {
            try {
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                
                // Show start screen once authenticated
                showScreen('start');
            } catch (error) {
                console.error("Authentication Error:", error);
                screens.loading.innerHTML = `<div class="text-red-500 font-bold p-4 bg-red-50 rounded">Failed to connect. Please try refreshing.</div>`;
            }
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            screens[screenName].classList.add('flex');
        }

        // Get strict public path as required by rules
        function getPublicCollectionPath() {
            return collection(db, 'artifacts', appId, 'public', 'data', PLAYER_COLLECTION);
        }
        function getPlayerDocRef(uid) {
            return doc(db, 'artifacts', appId, 'public', 'data', PLAYER_COLLECTION, uid);
        }

        // --- HOST LOGIC ---

        function startHostMode() {
            if (!currentUser) return;
            showScreen('host');
            
            // Listen to all players in the room
            const playersRef = getPublicCollectionPath();
            
            onSnapshot(playersRef, (snapshot) => {
                const now = Date.now();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Basic cleanup: only consider players who updated recently (e.g., last 30 mins)
                    // In a real app we'd use presence, but this serves as a basic filter.
                    activePlayers[doc.id] = data;
                });
            }, (error) => {
                console.error("Firebase Snapshot Error:", error);
            });

            // Start Render Loop
            requestAnimationFrame(renderHostCanvas);
        }

        function isInsideZone(px, py, zone) {
            return px >= zone.x && px <= (zone.x + zone.w) && 
                   py >= zone.y && py <= (zone.y + zone.h);
        }

        function renderHostCanvas() {
            // Clear canvas
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // Draw Background Grid (Optional aesthetic)
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i=0; i<CANVAS_W; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,CANVAS_H); ctx.stroke(); }
            for(let j=0; j<CANVAS_H; j+=50) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(CANVAS_W, j); ctx.stroke(); }

            // Draw Zones
            for (const key in zones) {
                const z = zones[key];
                
                // Fill
                ctx.fillStyle = z.color;
                ctx.fillRect(z.x, z.y, z.w, z.h);
                
                // Border
                ctx.strokeStyle = z.borderColor;
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 10]);
                ctx.strokeRect(z.x, z.y, z.w, z.h);
                ctx.setLineDash([]); // Reset
                
                // Label
                ctx.fillStyle = z.borderColor;
                ctx.font = 'bold 24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(z.label, z.x + (z.w/2), z.y + 40);
            }

            // Draw Players & Count
            let countA = 0;
            let countB = 0;
            const currentTime = Date.now();

            for (const id in activePlayers) {
                const p = activePlayers[id];
                
                // Optional: Filter out stale players (e.g., no updates for 1 hour)
                // if (p.lastUpdate && currentTime - p.lastUpdate > 3600000) continue;

                // Check collisions
                if (isInsideZone(p.x, p.y, zones.A)) countA++;
                else if (isInsideZone(p.x, p.y, zones.B)) countB++;

                // Draw Avatar Shadow
                ctx.beginPath();
                ctx.arc(p.x, p.y + 3, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();

                // Draw Avatar
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            // Update UI Counters
            document.getElementById('score-a').innerText = countA;
            document.getElementById('score-b').innerText = countB;

            // Loop
            requestAnimationFrame(renderHostCanvas);
        }


        // --- PLAYER LOGIC ---

        let localPlayerState = {
            x: CANVAS_W / 2, // Start in middle
            y: CANVAS_H / 2,
            color: '#000000',
            vx: 0,
            vy: 0
        };
        const PLAYER_SPEED = 6;
        let syncInterval = null;
        let physicsInterval = null;
        let hasStateChanged = true;

        async function startPlayerMode() {
            if (!currentUser) return;
            
            // Assign random color
            localPlayerState.color = avatarColors[Math.floor(Math.random() * avatarColors.length)];
            
            // Update UI
            document.getElementById('player-avatar').style.backgroundColor = localPlayerState.color;
            showScreen('player');

            // Setup input listeners
            setupControllerInputs();

            // Initial push to Firebase
            await pushStateToFirebase();

            // Start physics loop (60fps local updates)
            physicsInterval = setInterval(updatePlayerPhysics, 1000 / 60);

            // Start network sync loop (Sync to Firebase ~10 times a second if moved)
            syncInterval = setInterval(() => {
                if (hasStateChanged) {
                    pushStateToFirebase();
                    hasStateChanged = false;
                }
            }, 100);
        }

        async function pushStateToFirebase() {
            if (!currentUser) return;
            const docRef = getPlayerDocRef(currentUser.uid);
            try {
                await setDoc(docRef, {
                    x: localPlayerState.x,
                    y: localPlayerState.y,
                    color: localPlayerState.color,
                    lastUpdate: Date.now() // Use local time for rapid sync, ServerTimestamp causes latency
                });
            } catch (error) {
                console.error("Error syncing player state", error);
            }
        }

        function updatePlayerPhysics() {
            if (localPlayerState.vx === 0 && localPlayerState.vy === 0) return;

            // Apply velocity
            localPlayerState.x += localPlayerState.vx;
            localPlayerState.y += localPlayerState.vy;

            // Clamp to canvas bounds (accounting for radius)
            if (localPlayerState.x < PLAYER_RADIUS) localPlayerState.x = PLAYER_RADIUS;
            if (localPlayerState.x > CANVAS_W - PLAYER_RADIUS) localPlayerState.x = CANVAS_W - PLAYER_RADIUS;
            if (localPlayerState.y < PLAYER_RADIUS) localPlayerState.y = PLAYER_RADIUS;
            if (localPlayerState.y > CANVAS_H - PLAYER_RADIUS) localPlayerState.y = CANVAS_H - PLAYER_RADIUS;

            hasStateChanged = true;
        }

        function setupControllerInputs() {
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            const bindBtn = (btn, dx, dy) => {
                const press = (e) => {
                    e.preventDefault(); // Stop scrolling/zooming
                    btn.classList.add('active');
                    if (dx !== 0) localPlayerState.vx = dx * PLAYER_SPEED;
                    if (dy !== 0) localPlayerState.vy = dy * PLAYER_SPEED;
                };
                const release = (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    if (dx !== 0) localPlayerState.vx = 0;
                    if (dy !== 0) localPlayerState.vy = 0;
                };

                // Mouse Events
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
                
                // Touch Events
                btn.addEventListener('touchstart', press, {passive: false});
                btn.addEventListener('touchend', release, {passive: false});
                btn.addEventListener('touchcancel', release, {passive: false});
            };

            bindBtn(btnUp, 0, -1);
            bindBtn(btnDown, 0, 1);
            bindBtn(btnLeft, -1, 0);
            bindBtn(btnRight, 1, 0);
        }

        // --- Init Bindings ---
        document.getElementById('btn-host-start').addEventListener('click', startHostMode);
        document.getElementById('btn-player-start').addEventListener('click', startPlayerMode);

        // Kickoff
        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
        });

    </script>
</body>
</html>
