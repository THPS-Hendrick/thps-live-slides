<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Slides Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
        .slide-container { aspect-ratio: 16 / 9; }
        button { touch-action: manipulation; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-sans">

    <!-- LOBBY UI -->
    <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-50">
        <h1 class="text-3xl font-bold mb-6 text-blue-400">Live Slides</h1>
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-80 text-center">
            <input type="text" id="room-code" maxlength="4" placeholder="ROOM CODE" class="w-full text-center text-2xl font-bold p-3 mb-3 bg-gray-700 rounded text-white uppercase focus:outline-none">
            <input type="text" id="player-initials" maxlength="2" placeholder="INITIALS" class="w-full text-center text-2xl font-bold p-3 mb-4 bg-gray-700 rounded text-white uppercase focus:outline-none">
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded mb-4">Connect</button>
            <button id="host-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold py-2 rounded">Start as Host</button>
        </div>
    </div>

    <!-- HOST DASHBOARD (Dynamic Level Select) -->
    <div id="host-dashboard" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-40">
        <h2 class="text-3xl font-bold text-white mb-8">Select Presentation</h2>
        <div id="deck-list" class="grid gap-4 w-96">
            <!-- Populated by JS -->
        </div>
        <div class="mt-8 text-gray-400">Room: <span id="dash-room-code" class="text-white font-bold text-xl"></span></div>
    </div>

    <!-- HOST UI (The Presentation Canvas) -->
    <div id="host-ui" class="hidden absolute inset-0 z-10 flex items-center justify-center bg-black">
        <div class="absolute top-4 left-4 bg-black/50 px-4 py-2 rounded-lg z-20">
            <span class="text-gray-300 text-sm">Room: <span id="display-room-code" class="font-bold text-white ml-2"></span></span>
        </div>
        
        <!-- Hybrid Overlay: HTML Background + Canvas Foreground -->
        <div id="html-slide-layer" class="absolute slide-container bg-white w-[90vw] max-w-[1600px] rounded-xl overflow-hidden flex flex-col">
            <!-- Dynamic HTML Templates Injected Here -->
        </div>
        <canvas id="game-canvas" class="absolute slide-container w-[90vw] max-w-[1600px] z-10 pointer-events-none"></canvas>
    </div>

    <!-- PLAYER UI (The RPG Controller) -->
    <div id="player-ui" class="hidden absolute inset-0 flex flex-col items-center justify-between pb-8 bg-gray-900 z-20">
        
        <!-- Mobile Modal (Triggered by Host) -->
        <div id="mobile-modal" class="absolute inset-x-4 top-10 bg-white rounded-xl shadow-2xl p-6 hidden z-50 border-4 border-blue-500">
            <h3 id="modal-term" class="text-xl font-bold text-blue-900 mb-3 border-b pb-2"></h3>
            <p id="modal-explanation" class="text-gray-800 font-medium mb-4 text-sm leading-relaxed"></p>
            <div id="modal-excerpt" class="bg-gray-100 p-3 rounded text-xs text-gray-600 font-mono italic"></div>
            <div class="mt-4 text-center text-red-500 font-bold text-xs animate-pulse">Press 'B' to close</div>
        </div>

        <div class="mt-8 text-center text-gray-400">Room: <span id="player-room-display" class="text-white font-bold"></span></div>
        
        <div class="w-full max-w-md bg-gray-800 rounded-t-3xl p-6 flex justify-between items-center border-t border-gray-700">
            <!-- RPG D-PAD -->
            <div class="relative w-32 h-32 bg-gray-700 rounded-full shadow-inner border border-gray-600 p-1">
                <button id="btn-up" class="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-10 bg-gray-600 rounded-t-lg active:bg-blue-500"></button>
                <button id="btn-down" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-10 h-10 bg-gray-600 rounded-b-lg active:bg-blue-500"></button>
                <button id="btn-left" class="absolute left-0 top-1/2 -translate-y-1/2 w-10 h-10 bg-gray-600 rounded-l-lg active:bg-blue-500"></button>
                <button id="btn-right" class="absolute right-0 top-1/2 -translate-y-1/2 w-10 h-10 bg-gray-600 rounded-r-lg active:bg-blue-500"></button>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-gray-800 rounded-full shadow-inner"></div>
            </div>

            <!-- A/B Action Buttons -->
            <div class="flex gap-4 transform rotate-12">
                <button id="btn-b" class="w-14 h-14 bg-red-600 rounded-full shadow-[0_5px_0_#991b1b] active:shadow-[0_0px_0_#991b1b] active:translate-y-[5px] text-white font-black text-xl border-2 border-red-400">B</button>
                <button id="btn-a" class="w-14 h-14 bg-green-500 rounded-full shadow-[0_5px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-[5px] text-white font-black text-xl border-2 border-green-300">A</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
